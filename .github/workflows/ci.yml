name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and render dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest trimesh cairosvg

      - name: Run tests
        run: pytest

      - name: Render modules to SVG and PNG
        if: matrix.python-version == '3.12'
        run: python render_modules.py --out renders

      - name: Ensure renders are up to date
        if: matrix.python-version == '3.12'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff --stat
            echo "Render outputs changed. Run 'python render_modules.py --out renders' and commit the results." >&2
            exit 1
          fi
